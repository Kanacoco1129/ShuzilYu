<!DOCTYPE html>

      <span class="brand-seal">夢</span>

    <button class="mobile-menu" id="mobileMenu" type="button" aria-expanded="false" aria-controls="nav">☰ 選單</button>

    <nav class="nav" id="nav" aria-label="主要導覽">
      <button class="nav-link active" type="button" data-page="首頁">首頁</button>
      <button class="nav-link" type="button" data-page="自我介紹">自我介紹</button>

  <main id="app"></main>

    <div><span class="footer-seal">夢</span><span>夢向 / Meng Xiang</span></div>
    <span>櫛風沐雨，將會成炬</span>

  <div id="lightboxRoot"></div>

  <div class="music-player">

      <source src="audio/background.mp3" type="audio/mp3">
      你的瀏覽器不支援音訊播放。

    <button id="musicToggle" type="button" aria-pressed="false">♫ 播放音樂</button>
